</style>

<script>
(function(){

var T={

function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.i);toast.i=setTimeout(function(){t.classList.remove('show')},1800)}

/* ---------- language ---------- */
function paint(l){
  var d=T[l];lang=l;root.lang=l;root.dir=d.dir;
  $('bless').textContent=d.bless;$('verse').textContent=d.verse;
  [['blessL',d.blessL],['verseL',d.verseL]].forEach(function(p){var e=$(p[0]);e.textContent=p[1];e.hidden=!p[1]});
  $('badge').textContent=d.badge;$('intro').innerHTML=d.intro;
  $('copyT').textContent=d.copy;$('linksT').textContent=d.linksT;
  $('hT').textContent=d.hT;$('hL').textContent=d.hL;$('langBtn').textContent=d.btn;
  document.title=l==='ar'?'0xmicho | محمد – Junior Bug Bounty Hunter':'0xmicho | Mohamed – Junior Bug Bounty Hunter';
}
function setLang(l,animate){

  var v=$('view');v.classList.add("fading");
  setTimeout(function(){paint(l);v.classList.remove("fading")},300);
}
function toggleLang(){setLang(lang==='en'?'ar':'en',true)}

/* ---------- theme ---------- */
function readDot(){dot=getComputedStyle(root).getPropertyValue('--dot').trim()||dot}
function setTheme(t){root.setAttribute('data-theme',t);store('theme',t);
  var m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='dark'?'#07090b':'#f4f6f8';
  readDot();drawStatic()}
function toggleTheme(){setTheme(root.getAttribute('data-theme')==='dark'?'light':'dark')}

/* ---------- terminal ---------- */
function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function term(){
  var el=$('term'),cur='<span class="cur"></span>',html='',reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){LINES.forEach(function(l){html+='<span class="pr">$</span> '+esc(l[0])+'\n<span class="out">'+esc(l[1])+'</span>\n'});el.innerHTML=html+'<span class="pr">$</span> '+cur;return}
  var li=0,ci=0;
  (function step(){
    if(li>=LINES.length){el.innerHTML=html+'<span class="pr">$</span> '+cur;return}
    var cmd=LINES[li][0];
    if(ci<=cmd.length){el.innerHTML=html+'<span class="pr">$</span> '+esc(cmd.slice(0,ci))+cur;ci++;setTimeout(step,ci===1?500:55)}
    else{html+='<span class="pr">$</span> '+esc(cmd)+'\n<span class="out">'+esc(LINES[li][1])+'</span>\n';li++;ci=0;setTimeout(step,450)}
  })();
}

/* ---------- animated network background ---------- */
var cv=$('bg'),cx=cv.getContext('2d'),W=0,Hh=0,pts=[],raf=0,still=matchMedia('(prefers-reduced-motion: reduce)').matches;
function size(){
  var r=Math.min(window.devicePixelRatio||1,1.5);W=innerWidth;Hh=innerHeight;
  cv.width=W*r;cv.height=Hh*r;cx.setTransform(r,0,0,r,0,0);
  var n=Math.min(70,Math.round(W*Hh/22000));pts=[];
  for(var i=0;i<n;i++)pts.push({x:Math.random()*W,y:Math.random()*Hh,vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.25});
  drawStatic();
}
function frame(move){
  cx.clearRect(0,0,W,Hh);var D=Math.max(110,Math.min(W,Hh)/6),a=root.getAttribute('data-theme')==='dark'?.5:.4;
  for(var i=0;i<pts.length;i++){var p=pts[i];
    if(move){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>Hh)p.vy*=-1}
    cx.fillStyle='rgba('+dot+','+a+')';cx.beginPath();cx.arc(p.x,p.y,1.6,0,6.3);cx.fill();
    for(var j=i+1;j<pts.length;j++){var q=pts[j],dx=p.x-q.x,dy=p.y-q.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<D){cx.strokeStyle='rgba('+dot+','+(a*(1-d/D)*.6)+')';cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(q.x,q.y);cx.stroke()}}}
}
function drawStatic(){if(still||document.hidden)frame(false)}
function loop(){frame(true);raf=requestAnimationFrame(loop)}
function run(){cancelAnimationFrame(raf);if(!still&&!document.hidden)loop()}

$('chips').innerHTML=CHIPS.map(function(c){return'<span>'+c+'</span>'}).join('');

document.addEventListener('keydown',function(e){

  if(k==='t')toggleTheme();else if(k==='l')toggleLang();
});
var rt;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(size,200)});
document.addEventListener('visibilitychange',run);
matchMedia('(prefers-color-scheme: light)').addEventListener&&matchMedia('(prefers-color-scheme: light)').addEventListener('change',function(e){if(!load('theme'))setTheme(e.matches?'light':'dark')});
})();
